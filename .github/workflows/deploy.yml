name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 187.52.121.50
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "./*"
          target: "/opt/bkchiangmai"
          strip_components: 0
          rm: true

      - name: Build & Restart Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.52.121.50
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/bkchiangmai
            docker compose pull
            docker compose up -d --build --remove-orphans
            docker system prune -af --filter "until=24h"