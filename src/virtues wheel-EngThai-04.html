<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Virtuescope</title>
    <link href="https://fonts.googleapis.com/css?family=Prompt" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            text-align: center;
            background-color: #ffffff;
            color: #444;
            padding: 20px;
        }
        h1 {
            color: #DAA520;
            font-size: 48px;
            margin-bottom: 15px;
        }
        .wheel-container {
            position: relative;
            margin: 0 auto;
            width: 700px;
            height: 700px;
        }
        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            transition: transform 4s cubic-bezier(0.33, 1, 0.68, 1);
        }
        .arrow {
            position: absolute;
            top: 50%;
            right: -30px;
            transform: translateY(-50%) rotate(90deg);
            font-size: 40px;
            color: red;
            z-index: 10;
        }
        .description {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }
        .result-box {
            margin: 20px auto;
            padding: 15px;
            border-radius: 8px;
            width: 500px;
            color: white;
            font-size: 1.2em;
            min-height: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        button {
            background-color: #DAA520;
            color: white;
            border: none;
            padding: 12px 25px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 20px;
            margin-top: 15px;
            font-family: 'Prompt', sans-serif;
        }
    </style>
</head>
<body>

<h1>Virtuescope</h1>

<div class="wheel-container">
    <div class="arrow">▼</div>
    <canvas id="wheel" width="500" height="500"></canvas>
</div>

<!-- ข้อความหลัก -->
<p class="main-text">หมุนวงล้อแห่งคุณธรรมในทุกวัน และดื่มด่ำกับความมหัศจรรย์</p>

<!-- ข้อความรอง -->
<p class="sub-text">ให้จดจำคุณธรรมที่ได้รับไว้ในใจ แล้วดูว่าคุณธรรมนั้นจะเติมเต็มความคิด สภาพแวดล้อม และโลกของคุณอย่างไร</p>

<div id="result" class="result-box">Your Virtue Will Appear Here!</div>

<button onclick="spinWheel()">Spin Again</button>

<script>
const virtues = [
    "Humility", // ความถ่อมตน

    "Responsibility", // ความรับผิดชอบ
    "Harmony", // ความกลมเกลียว
    "Wisdom", // ปัญญา
    "Faith", // ศรัทธา
    "Friendship", // มิตรภาพ
    "Self-confidence", // ความมั่นใจในตัวเอง
    "Detachment", // การปล่อยวาง
    "Happiness", // ความสุข
    "Enthusiasm", // ความกระตือรือร้น
    "Discernment", // การพิจารณาอย่างรอบคอบ
    "Tolerance", // ความอดทนต่อความแตกต่าง
    "Contentment", // ความพอใจ
    "Compassion", // ความเมตตา
    "Simplicity", // ความเรียบง่าย
    "Courage", // ความกล้าหาญ
    "Patience", // ความอดทน
    "Discipline", // ระเบียบวินัย
    "Delicacy", // ความละเอียดอ่อน
    "Brotherhood" // ความเป็นพี่น้อง
];

const descriptions = {
    "Humility": {
        en: "You acknowledge your strengths and weaknesses modestly.",
        th: "คุณยอมรับจุดแข็งและจุดอ่อนของคุณอย่างถ่อมตน.",
        virtueTh: "ความถ่อมตน"
    },
    "Spontaneity": {
        en: "You act naturally and authentically.",
        th: "คุณแสดงออกอย่างเป็นธรรมชาติและจริงใจ.",
        virtueTh: "ความเป็นธรรมชาติ"
    },
    "Responsibility": {
        en: "You honor your commitments and take ownership of your actions.",
        th: "คุณเคารพคำมั่นสัญญาและรับผิดชอบต่อการกระทำของคุณ.",
        virtueTh: "ความรับผิดชอบ"
    },
    "Harmony": {
        en: "You create balance and peace around you.",
        th: "คุณสร้างความสมดุลและความสงบสุขรอบตัวคุณ.",
        virtueTh: "ความกลมเกลียว"
    },
    "Wisdom": {
        en: "You apply knowledge thoughtfully and insightfully.",
        th: "คุณใช้ความรู้ด้วยความรอบคอบและมีวิจารณญาณ.",
        virtueTh: "ปัญญา"
    },
    "Faith": {
        en: "You trust deeply in the goodness of life.",
        th: "คุณเชื่อมั่นในความดีงามของชีวิตอย่างลึกซึ้ง.",
        virtueTh: "ศรัทธา"
    },
    "Friendship": {
        en: "You build strong bonds through kindness and trust.",
        th: "คุณสร้างความสัมพันธ์ที่แน่นแฟ้นผ่านความเมตตาและความไว้วางใจ.",
        virtueTh: "มิตรภาพ"
    },
    "Self-confidence": {
        en: "You accept your good points with humility and simply dare to be great.",
        th: "คุณยอมรับจุดเด่นของตัวเองด้วยความถ่อมตนและกล้าที่จะยอดเยี่ยม.",
        virtueTh: "ความมั่นใจในตัวเอง"
    },
    "Detachment": {
        en: "You remain calm and objective, unaffected by external situations.",
        th: "คุณสงบและมองสิ่งต่าง ๆ อย่างเป็นกลางโดยไม่ถูกสถานการณ์ภายนอกกระทบ.",
        virtueTh: "การปล่อยวาง"
    },
    "Happiness": {
        en: "You radiate joy and positivity.",
        th: "คุณเปล่งประกายความสุขและพลังบวก.",
        virtueTh: "ความสุข"
    },
    "Enthusiasm": {
        en: "You approach life with excitement and energy.",
        th: "คุณเผชิญชีวิตด้วยความตื่นเต้นและพลังงาน.",
        virtueTh: "ความกระตือรือร้น"
    },
    "Discernment": {
        en: "You have clarity in judgment and decision-making.",
        th: "คุณมีความชัดเจนในการตัดสินใจและการวินิจฉัย.",
        virtueTh: "การพิจารณาอย่างรอบคอบ"
    },
    "Tolerance": {
        en: "You accept and respect differences.",
        th: "คุณยอมรับและเคารพความแตกต่าง.",
        virtueTh: "ความอดทนต่อความแตกต่าง"
    },
    "Contentment": {
        en: "You appreciate what you have and find joy in simplicity.",
        th: "คุณชื่นชมสิ่งที่คุณมีและพบความสุขในความเรียบง่าย.",
        virtueTh: "ความพอใจ"
    },
    "Compassion": {
        en: "You empathize deeply with others.",
        th: "คุณมีความเห็นอกเห็นใจต่อผู้อื่นอย่างลึกซึ้ง.",
        virtueTh: "ความเมตตา"
    },
    "Simplicity": {
        en: "You value clarity and straightforwardness.",
        th: "คุณให้คุณค่ากับความชัดเจนและความตรงไปตรงมา.",
        virtueTh: "ความเรียบง่าย"
    },
    "Courage": {
        en: "You face challenges bravely.",
        th: "คุณเผชิญความท้าทายอย่างกล้าหาญ.",
        virtueTh: "ความกล้าหาญ"
    },
    "Patience": {
        en: "You calmly endure and persist through difficulties.",
        th: "คุณอดทนและยืนหยัดผ่านความยากลำบากอย่างสงบ.",
        virtueTh: "ความอดทน"
    },
    "Discipline": {
        en: "You maintain focus and self-control.",
        th: "คุณรักษาสมาธิและควบคุมตัวเองได้ดี.",
        virtueTh: "ระเบียบวินัย"
    },
    "Delicacy": {
        en: "You handle situations with sensitivity and care.",
        th: "คุณจัดการสถานการณ์ด้วยความละเอียดอ่อนและเอาใจใส่.",
        virtueTh: "ความละเอียดอ่อน"
    },
    "Brotherhood": {
        en: "You foster unity and support among others.",
        th: "คุณส่งเสริมความสามัคคีและการสนับสนุนในกลุ่มคน.",
        virtueTh: "ความเป็นพี่น้อง"
    }
};

const colors = ["#3e3b6f","#55ddaa","#44ccbb","#33bbcc","#22aaff","#2299ff",
"#3388ee","#4477dd","#5566cc","#6655bb","#992288","#aa336a","#bb4455","#f15152",
"#ff7b54","#ffb26b","#ffd56e","#ffe156","#f9d56e","#f0a07c","#e06c7d","#f15152"];

const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
let currentAngle = 0;

function drawWheel() {
    const arcSize = (2 * Math.PI) / virtues.length;
    for(let i = 0; i < virtues.length; i++) {
        ctx.beginPath();
        ctx.moveTo(250, 250);
        ctx.arc(250, 250, 250, i * arcSize, (i + 1) * arcSize);
        ctx.closePath();
        ctx.fillStyle = colors[i];
        ctx.fill();
        ctx.save();
        ctx.translate(250, 250);
        ctx.rotate(i * arcSize + arcSize / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#fff";
        ctx.font = "bold 16px Prompt";
        ctx.fillText(virtues[i], 235, 8);
        ctx.restore();
    }
}

function spinWheel(){
    const spinDegrees = Math.floor(Math.random() * 360) + 3600; // หมุน 3600 องศาเพื่อสร้างการหมุนหลายรอบ
    currentAngle += spinDegrees;
    canvas.style.transform = `rotate(${currentAngle}deg)`;

    setTimeout(() => {
        const normalizedAngle = (360 - (currentAngle % 360)) % 360; // ปรับมุมให้เป็น 0-360
        const arcAngle = 360 / virtues.length; // มุมของแต่ละส่วน
        const index = Math.floor(normalizedAngle / arcAngle); // คำนวณ index ตรงกับลูกศร

        const virtue = virtues[index]; // ดึง Virtue ตาม index ที่คำนวณได้
        const color = colors[index]; // ดึงสีตาม index ที่คำนวณได้
        const description = descriptions[virtue]; // ดึงคำอธิบายตาม Virtue

        // อัปเดตผลลัพธ์ในหน้า HTML
        const resultBox = document.getElementById('result');
        resultBox.innerHTML = `<h2>${virtue}<br>${description.virtueTh}</h2><p>${description.en}</p><p>${description.th}</p>`;
        resultBox.style.backgroundColor = color;
    }, 4000); // รอ 4 วินาทีหลังการหมุน
}

drawWheel();
</script>

</body>
</html>
